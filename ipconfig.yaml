network:
  version: 2
  renderer: NetworkManager
  ethernets:
    enp3s0:
      dhcp4: no
      addresses:
        - 192.168.0.123/24     # 第一个网段
        - 192.168.1.123/24     # 第二个网段
        - 169.254.49.123/24    # 第三个网段
      routes:
        - to: default
          via: 192.168.0.1
          metric: 100
          table: 100
        - to: default
          via: 192.168.1.254
          metric: 100
          table: 101
        - to: default
          via: 169.254.49.1      # 第三个网关
          metric: 100
          table: 102
        - to: 10.0.0.0/8
          via: 192.168.1.254
          table: 101
      routing-policy:
        - from: 192.168.0.0/24
          table: 100
        - from: 192.168.1.0/24
          table: 101
        - from: 169.254.49.0/24
          table: 102
      nameservers:
        addresses:
          - 8.8.8.8
          - 8.8.4.4