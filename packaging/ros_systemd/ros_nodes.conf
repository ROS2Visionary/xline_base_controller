# XLine ROS 配置文件
# 修改后执行: systemctl restart xline-ros
#
# 注意: 行内不支持 # 注释，# 只能出现在行首

# ==============================================================
# [settings] 全局路径配置
# ==============================================================
[settings]
# 工作空间 setup.bash 路径，source 后 ros2 命令可用
ros_ws_setup  = XLINE_WS_SETUP_PATH

# 数据根目录（XLINE_WS_ROOT 环境变量）
xline_ws_root = XLINE_WS_ROOT_VALUE

# ==============================================================
# 节点配置 — 每个 [name] 代表一个节点，name 用于日志显示
#
# enabled : true 启用 / false 禁用
# type    : run（ros2 run）或 launch（ros2 launch）
# pkg     : ROS 包名
# node    : 节点可执行文件名（type=run）或 launch 文件名（type=launch）
# delay   : 启动此节点后额外等待的秒数，用于有依赖关系的节点（默认 0）
# ==============================================================

[wheels_driver]
enabled = true
type    = run
pkg     = wheels_driver
node    = wheels_driver_node
delay   = 4

[planner]
enabled = true
type    = run
pkg     = xline_path_planner
node    = planner_node

[localization]
enabled = true
type    = run
pkg     = xline_localization
node    = localization_node

[inkjet_printer]
enabled = true
type    = run
pkg     = xline_inkjet_printer
node    = inkjet_printer_node

[stepper_motor]
enabled = true
type    = run
pkg     = stepper_motor_driver
node    = stepper_motor_node

[base_controller]
enabled = false
type    = run
pkg     = xline_base_controller
node    = base_controller_node

[cmd_vel_mux]
enabled = true
type    = run
pkg     = xline_cmd_vel_mux
node    = cmd_vel_mux_node

[lslidar]
enabled = false
type    = run
pkg     = lslidar_driver
node    = lslidar_driver_node

[obstacle_detector]
enabled = false
type    = run
pkg     = xline_obstacle_detector
node    = xline_obstacle_detector_node

[ln150_driver]
enabled = true
type    = run
pkg     = xline_ln150_driver
node    = ln150_driver_node
delay   = 5

[beiwei_imu]
enabled = true
type    = launch
pkg     = beiwei_imu_driver
node    = beiwei_imu_driver.launch.py
