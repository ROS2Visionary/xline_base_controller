# ==============================================================================
# 前馈+LQR 曲线路径跟踪控制器参数配置
# ==============================================================================

# LQR 权重参数
lqr:
  # 横向误差权重 q1（仅当 use_direct_gains=false 时生效）
  q1: 200.0

  # 航向误差权重 q2
  q2: 100.0

  # 控制量权重 r
  r: 1.0

  # 直接指定增益（推荐 true，避免 q/r 计算值 K1≈282 导致 tanh 退化为 bang-bang）
  # use_direct_gains=false + q1=200/r=1/v=0.05 → K1=√200/0.05≈282.8，
  # 在任意正常误差下 omega_fb_raw >> prop_limit，tanh≈1，K1/K2 完全失去调控意义。
  # 参考圆弧控制器 C19 验证值：K1=6.0, K2=1.5
  # 曲线 v=0.05（慢于圆弧 0.07），适当提高 K1 补偿：K1=8.0, K2=1.5
  use_direct_gains: true

  # 横向误差增益（直接指定）
  # 设计依据：v=0.05, κ=2/m, before_print=0.20
  #   prop_limit = 0.10×0.20 = 0.020 rad/s
  #   K1×e_y(3mm) = 8.0×0.003 = 0.024，ratio=1.2 → tanh(1.2)=0.83，进入比例区
  K1_direct: 8.0

  # 航向误差增益（直接指定，与圆弧 C19 相同，保持临界阻尼特性）
  K2_direct: 1.5


  # 积分项参数（LQI，可选）
  enable_integral: false
  # 积分增益
  Ki: 0.5
  # 积分饱和限制 (rad/s)
  integral_max: 0.1
  # 积分衰减系数（0-1之间，越小衰减越快）
  integral_decay: 0.99

# 速度限制参数
velocity:
  # 最大线速度 (m/s)
  max: 0.05

  # 最小线速度 (m/s)
  min: 0.01

  # 最大角速度 (rad/s)
  omega_max: 0.3

  # 最大角加速度 (rad/s²)
  omega_dot_max: 0.5

# 机器人参数
robot:
  # 轮距 (m)
  wheel_base: 0.3

# 前瞻参数
lookahead:
  # 前瞻距离 (m) - 基于弧长的前瞻
  distance: 0.01

  # 前瞻时间 (s) - 额外的时间前瞻
  # 总前瞻 = distance + time * v_max
  time: 0.2

# 最近点搜索窗口
search:
  # 向后搜索窗口大小
  # 用于避免曲线处最近点索引震荡
  window_back: 10

  # 向前搜索窗口大小
  # 圆形路径需要更大的搜索窗口
  window_forward: 50


# 目标到达判定参数
goal:
  # 距离容差 (m)
  dist_tolerance: 0.01

  # 角度容差 (rad)
  angle_tolerance: 0.05

# 控制参数
control:
  # 控制频率 (Hz)
  # 注：实际控制频率由上层调用频率决定，此参数仅用于计算控制周期
  frequency: 18.0

# 原地旋转控制参数（梯形速度规划）
rotation:
  # 旋转最大角速度 (rad/s)
  max_w: 0.8

  # 旋转最小角速度 (rad/s)（固定下限，克服静摩擦）
  min_w: 0.15

  # 最大角减速度 (rad/s²)
  # 制动速度公式：ω = sqrt(2 * decel * |e|)
  # 调参参考：decel = max_w² / (2 * 期望制动角度)
  #   例：max_w=0.8, 期望在 0.2rad 内刹停 → decel = 0.64/0.4 = 1.6
  decel: 1.6

  # 加速度 (rad/s²)（slew rate 阻尼，限制角速度变化率，平滑启停）
  accel: 2.0

  # 提前降至 min_w 的角度裕量 [rad]（在此角度内以 min_w 匀速滑行至停止）
  pre_stop_angle: 0.05


# 反馈限制参数
feedback:
  # 反馈角速度限制比例（相对于前馈的百分比）
  # 反馈量被限制在 ±|前馈| × limit_ratio 范围内
  # 建议：0.05 表示反馈不超过前馈的5%
  limit_ratio: 0.1

  # 最小反馈限制 (rad/s)
  # 设置为0表示不使用最小限制，严格按照比例计算
  # 注意：前馈为0时（直线路径）反馈也将被限制为0
  min_limit: 0.0

  # e_theta IIR 低通滤波系数（α=1.0 为无滤波，α=0.82 参考圆弧调优结果）
  e_theta_lowpass_alpha: 0.82

  # 横向误差跳变检测阈值（m）。超过此值时冻结积分，防止 windup。0.0=禁用。
  max_ey_jump_m: 0.005

  # 积分项输出独立限幅比例（相对于 |前馈|）
  int_limit_ratio: 0.35

  # 打印前反馈限制比例（未打印时，相对于 |前馈|）
  # 参考圆弧 C19：before=0.30。曲线 v 更低，保守起调 0.20。
  # 设计验证：v=0.05, κ=2/m → omega_ff=0.10, prop_limit=0.020
  #   K1×e_y(3mm)=0.024, ratio=1.2 → tanh(1.2)=0.83 → 比例区有效工作
  limit_ratio_before_print: 0.20

  # 打印中反馈限制比例（打印期间，相对于 |前馈|）
  # 与 before 保持一致作为初始基线，待 C01 后根据测试数据调整
  limit_ratio_after_print: 0.20

# 滤波器参数
filter:
  # 位置滤波器参数
  position:
    # Hampel滤波器窗口大小（用于异常值检测）
    # 建议范围: 3-7，值越大对异常值越不敏感
    hampel_window: 5

    # Hampel滤波器异常值阈值（标准差倍数）
    # 建议范围: 2.0-4.0，值越大允许更大的偏差
    hampel_k: 3.0

    # Savitzky-Golay滤波器窗口大小（用于平滑）
    # 建议范围: 5-9（必须为奇数），值越大平滑效果越强
    savgol_window: 7

    # Savitzky-Golay滤波器多项式阶数
    # 建议范围: 2-3，阶数越高拟合越精确但可能引入噪声
    savgol_order: 2

# 追踪与调优记录
tracking:
  # 曲线编号（0-9，每条不同曲线路径分配一个编号）
  # 每次测试不同路径时修改此值（0=重置目录+开始新批次）
  curve_slot: 0

# 优化元信息（每次调参必须更新这三个字段）
optimization:
  id: "curve_C00_arch_corrected"
  parent_batch_id: ""
  change_note: "架构修正基线：移除SG延迟/K1=8.0直接增益/before_print=0.20"

# 调试参数
debug:
  # 是否启用调试输出
  enable: true

  # 是否输出详细日志
  verbose: true

  # 是否启用栅格图可视化
  enable_grid_map: true

  # 栅格图保存路径（相对路径或绝对路径）
  grid_map_path: 'grid_maps'
