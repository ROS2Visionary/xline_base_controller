# 机器人几何参数 (单位: 米，以机器人左上角为原点)
robot_geometry:
  length: 0.4     # 机器人长度 (前后方向)
  width: 0.34      # 机器人宽度 (左右方向)

# 激光雷达位置 (单位: 米，相对于机器人左上角原点)
lidar_position:
  x: 0.17          # 雷达x坐标 (向右为正)
  y: 0.375          # 雷达y坐标 (向后为正)

# 检测距离配置 (单位: 米，以机器人边界为基准)
detection_distances:
  front: 1.0      # 前方检测距离
  back: 1.0       # 后方检测距离
  left: 1.0       # 左侧检测距离
  right: 1.0      # 右侧检测距离
    

# 话题配置
topics:
  laser_topic: /scan
    
mask:
  mask_angle: 0.0
  mask_range: 3.0