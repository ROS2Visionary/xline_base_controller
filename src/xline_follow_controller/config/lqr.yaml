# ==============================================================================
# 前馈+LQR 高精度路径跟踪控制器参数配置
# ==============================================================================

# LQR 权重参数
lqr:
  # 横向误差权重 q1（状态权重矩阵Q的第一个对角元素）
  q1: 1.0

  # 航向误差权重 q2（状态权重矩阵Q的第二个对角元素）
  q2: 200.0

  # 控制量权重 r
  r: 1.0

  # ================================
  # 直接指定增益（推荐）
  # ================================
  # 如果 use_direct_gains=true，则直接使用 K1_direct 和 K2_direct
  # 如果 use_direct_gains=false，则从 q1, q2, r 计算增益

  use_direct_gains: true

  # 横向误差增益 K1（直接指定）
  # 注意：K1 与速度成反比，这里给出的是 v=0.05 m/s 时的增益
  # 圆形路径建议使用较小的增益，主要依靠前馈控制
  # v=0.05 m/s → K1=6.0 (圆形), K1=20.0 (直线)
  # v=0.1  m/s → K1=3.0 (圆形), K1=10.0 (直线)
  K1_direct: 6.0

  # 航向误差增益 K2（直接指定）
  # 圆形路径建议降低增益，避免过度调节
  K2_direct: 6.0

  # ================================
  # 积分项参数（LQI，可选）
  # ================================
  # 积分项可以消除静态误差，但可能引入振荡
  # 建议先不开启，如果有持续偏差再考虑

  enable_integral: false

  # 积分增益
  Ki: 0.5

  # 积分饱和限制 (rad/s)
  integral_max: 0.1

  # 积分衰减系数（0-1之间，越小衰减越快）
  integral_decay: 0.99

# ==============================================================================
# 速度限制参数
# ==============================================================================
velocity:
  # 最大线速度 (m/s)
  # 建议：18Hz 控制频率下，使用 0.05 m/s 可达到约 5mm 精度
  max: 0.05

  # 最小线速度 (m/s)
  min: 0.01

  # 最大角速度 (rad/s)
  # 圆形路径：v × κ = 0.05 × 2.0 = 0.1，留有余量设置为 0.3
  omega_max: 0.3

  # 最大角加速度 (rad/s²)
  # 用于平滑控制，避免角速度突变
  # 降低角加速度限制可以减少震荡
  omega_dot_max: 0.5

# ==============================================================================
# 机器人参数
# ==============================================================================
robot:
  # 轮距 (m)
  wheel_base: 0.3

# ==============================================================================
# 前瞻参数
# ==============================================================================
lookahead:
  # 前瞻距离 (m) - 基于弧长的前瞻
  # 圆形路径需要更大的前瞻距离以提前预测曲率
  # 建议：18Hz + 0.05m/s → 0.035m
  distance: 0.035

  # 前瞻时间 (s) - 额外的时间前瞻
  # 总前瞻 = distance + time * v_max
  # 圆形路径增加时间前瞻: 0.035 + 0.3 × 0.05 = 0.05m
  time: 0.3

# ==============================================================================
# 最近点搜索窗口
# ==============================================================================
search:
  # 向后搜索窗口大小
  # 用于避免曲线处最近点索引震荡
  window_back: 10

  # 向前搜索窗口大小
  # 圆形路径需要更大的搜索窗口
  window_forward: 50

# ==============================================================================
# 目标到达判定参数
# ==============================================================================
goal:
  # 距离容差 (m)
  dist_tolerance: 0.01

  # 角度容差 (rad)
  angle_tolerance: 0.05

# ==============================================================================
# 控制参数
# ==============================================================================
control:
  # 控制频率 (Hz)
  # 注意：实际控制频率由上层调用频率决定，此参数仅用于计算控制周期
  frequency: 18.0

# ==============================================================================
# 原地旋转控制参数
# ==============================================================================
rotation:
  # 旋转速度调节因子（sigmoid函数增益）
  # 用于平滑角速度变化: factor = 1.0 / (1.0 + exp(-factor × |angle_diff|))
  # 建议范围: 0.8 - 2.0
  factor: 1.2

  # 旋转最大角速度 (rad/s)
  # 建议: 0.5 - 1.0 rad/s
  max_w: 0.8

  # 旋转最小角速度 (rad/s)
  # 小角度时使用，避免角速度过小导致不转
  # 建议: 0.1 - 0.2 rad/s
  min_w: 0.15

  # 角度阈值 (rad)
  # 小于此角度时使用余弦平滑
  # 建议: 0.3 - 0.6 rad (约 17° - 34°)
  angle_threshold: 0.5

  # 平滑因子（小角度时的余弦平滑系数）
  # 用于进一步平滑小角度时的角速度
  # 建议范围: 0.4 - 0.8
  smooth_factor: 0.6

# ==============================================================================
# 路径类型参数
# ==============================================================================
path:
  # 是否为圆形路径
  # true: 固定使用最大线速度（适合圆形路径保持稳定曲率跟踪）
  # false: 线速度可变（适合一般路径）
  is_circular: true

# ==============================================================================
# 反馈限制参数
# ==============================================================================
feedback:
  # 反馈角速度限制比例（相对于前馈的百分比）
  # 反馈量被限制在 ±|前馈| × limit_ratio 范围内
  # 建议：0.05 表示反馈不超过前馈的5%
  limit_ratio: 0.05

  # 最小反馈限制 (rad/s)
  # 设置为0表示不使用最小限制，严格按照比例计算
  # 注意：前馈为0时（直线路径）反馈也将被限制为0
  min_limit: 0.0

# ==============================================================================
# 调试参数
# ==============================================================================
debug:
  # 是否启用调试输出
  enable: true

  # 是否输出详细日志
  verbose: true

  # 是否启用栅格图可视化
  enable_grid_map: true

  # 栅格图保存路径（相对路径或绝对路径）
  grid_map_path: 'grid_maps'
