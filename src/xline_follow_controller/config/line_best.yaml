
# 调试配置
debug:
  enabled: true
  raw_path: "xline_follow_controller/path_l"
  filtered_path: "xline_follow_controller/path_sg"

# 优化元信息（会写入 line_tracking_latest 的 metrics/batch，便于闭环分析）
optimization:
  id: "opt_20260304_b35_floor_revert_v1"
  parent_batch_id: "1772643134732"
  change_note: "k2_min_floor_scale=0.45(revert:0.55->0.45);fix:floor override anti_cancel on path_01/02"


# 航向PID控制
heading_pid:
  alignment:                         # 对齐阶段
    kp: 1.2
    ki: 0.0
    kd: 0.15
  following:                         # 跟随阶段
    kp: 1.2
    ki: 0.0
    kd: 0.15


# 速度控制
velocity:
  # 速度限制
  accel_min: 0.05                    # 加速时最小线速度 [m/s]
  decel_min: 0.05                    # 减速时最小线速度 [m/s]
  walk_max: 0.25                     # 步行模式最大速度 [m/s]
  work_max: 0.25                     # 工作模式最大速度 [m/s]
  alignment: 0.05                    # 对齐阶段速度 [m/s]
  # 调速参数
  acce_factor: 0.002                # 加速因子
  accel_sigmoid_k: 3.0               # 加速sigmoid系数
  decel_sigmoid_k: 4.0              # 减速sigmoid系数
  accel_sigmoid_center: 0.5          # 加速sigmoid中心点
  decel_sigmoid_center: 0.5          # 减速sigmoid中心点


# 距离阈值
distance:
  alignment: 0.08                    # 对齐距离阈值 [m]
  deceleration: 0.25                  # 减速距离 [m]
  acceleration: 0.15                 # 加速阶段距离 [m]
  lookahead: 0.158                   # 前瞻基础距离 [m]
  lookahead_time: 0.014              # 前瞻时间系数 [s], 总前瞻 = lookahead + lookahead_time * speed
  waypoint_tolerance: 0.008          # 路径点容差 [m]


# 滤波器配置
filter:
  # 位置滤波
  pos_hampel_window: 5               # Hampel窗口大小
  pos_hampel_k: 3.0                  # Hampel异常值阈值
  pos_savgol_window: 5               # Savitzky-Golay窗口大小
  pos_savgol_order: 3                # Savitzky-Golay多项式阶数
  # 角速度滤波
  angular_hampel_window: 5           # Hampel窗口大小
  angular_hampel_k: 3.0              # Hampel异常值阈值


# 起步回线 / 进线制导（决定 handlePathFollowing 里目标航向生成方式）
guidance:
  mode: "weighted_yaw"                     # "weighted_yaw" | "stanley" | "hybrid"
  alignment_mode: "stanley"          # mode=hybrid 时生效：对齐阶段制导
  following_mode: "weighted_yaw"     # mode=hybrid 时生效：跟随阶段制导
  stanley_k: 1.0                     # stanley: 增益 k
  stanley_v0: 0.1                   # stanley: 低速软化项 v0 [m/s]
  theta_max: 0.25                     # 最大截获角限制 [rad]


# 阶段控制参数
phase:
  alignment:                         # 对齐阶段
    max_angular_vel: 0.054           # 最大角速度 [rad/s]
    max_angular_accel: 3.4          # 最大角加速度 [rad/s²]
    current_heading_weight: 0.0      # 当前航向权重
    target_heading_weight: 1.0       # 目标航向权重
    filter_alpha: 1.0               # 低通滤波系数

    smoother_freq: 15.0              # 平滑器频率 [Hz]
    smoother_damping: 0.96           # 平滑器阻尼比
    line_cross_track_tolerance: 0.0060 # 起步：到直线的横向误差阈值 [m]
    line_heading_tolerance: 0.030     # 起步：相对直线航向的误差阈值 [rad]
    line_alignment_stable_count: 5   # 起步：连续满足次数（抗抖）

  following:                         # 跟随阶段
    max_angular_vel: 0.066           # 最大角速
    max_angular_accel: 5.2          # 最大角加速度 [rad/s²]
    current_heading_weight: 0.0      # 当前航向权重
    target_heading_weight: 1.0       # 目标航向权重
    filter_alpha: 0.95               # 低通滤波系数
    
    smoother_freq: 15.0              # 平滑器频率 [Hz]
    smoother_damping: 0.8           # 平滑器阻尼比


# 原地旋转控制（梯形速度规划）
rotation:
  max_w: 0.85                        # 最大角速度 [rad/s]
  min_w: 0.1                         # 最小角速度 [rad/s]（固定下限，克服静摩擦）
  decel: 1.6                         # 最大角减速度 [rad/s²]
                                     # 公式：ω = sqrt(2 * decel * |e|)
                                     # 调参：decel = max_w² / (2 × 期望制动角度)
  accel: 2.0                         # 加速度 [rad/s²]（slew rate 阻尼，平滑启停）
  pre_stop_angle: 0.05               # 提前降至 min_w 的角度裕量 [rad]（约3°）


# e_y 输入滤波
# 速率限制：将 Hampel 回退阶跃转为斜坡，防止 LQR 平滑器状态被突变污染
# 一阶低通：衰减速率限制后的常规高频残余噪声
ey_filter:
  rate_limit:
    enabled: true
    noise_floor: 0.002         # 帧间变化最小阈值 [m]，对应 SG 后残余噪声顶部
    rate_factor: 0.16          # 运动学分量系数：max_change = max(noise_floor, v*dt*factor)
  lowpass:
    enabled: true
    alpha: 0.87                # 低通系数 (0,1]，越接近 1 延迟越小


# LQR 角速度控制参数
lqr_angular_control:
  # 是否启用 LQR 方式计算角速度（false 则使用 PID）
  enabled: true

  # LQR 权重参数（use_direct_gains=false 时生效）
  # 推导目标：v=0.25 时 K1≈2.50，K2≈1.07，ζ≈0.68（略高于临界最优，增强全速域阻尼）
  # 公式：K1 = √(q1/r) / v  →  q1 = (K1×v)² = (2.50×0.25)² = 0.39（不变）
  #       K2 = √(2√(q1·q2)/r + q2/r) = 1.07  →  q2 = 0.38（原0.31）
  # b34 根因：B33 path_04/05 积分长期饱和（78-89%），path_06 中段 ζ=0.42（严重欠阻尼）
  q1: 0.39
  q2: 0.38
  r: 1.0

  # K1 限幅：低速段（对齐/减速）K1 理论值会升至 12+，K1_max=8 防止过激
  # v=0.05: K1_theory=12.5 → clip 至 8.0，此时 ζ≈0.79（轻过阻尼，对齐更平稳）
  K1_max: 8.0
  K1_min: 1.5

  # 是否直接指定增益（false 则从 q1, q2, r 计算，K1 随速度自适应）
  use_direct_gains: false
  K1_direct: 5.8     # 备用（use_direct_gains=true 时才生效）
  K2_direct: 0.84     # 备用（use_direct_gains=true 时才生效）

  # 大横向误差时动态衰减 K2，降低 -K1*e_y 与 -K2*e_theta 互相抵消
  # ey_start 提升至 4.8mm：<5mm 段保留完整 K2 阻尼，直接支撑 <3mm 精度目标
  # K2 门控：K2=1.07，ey_end 延长至 18mm 减缓门控，使 8-15mm 大误差段阻尼更充足
  # ey_end: 0.012→0.018: path_06 中段 e_y≈9mm 处 gate_scale 从 0.71→0.88（K2 多保留 17%）
  # min_scale: 0.50→0.62: 最差情况 K2_eff=1.07×0.62=0.66（原 1.00×0.50=0.50）
  k2_gate:
    enabled: true
    ey_start: 0.0048
    ey_end: 0.0180
    min_scale: 0.62

  # anti_cancel：scale 维持 0.45，阈值不变
  k2_anti_cancel:
    enabled: true
    scale: 0.45
    ey_threshold: 0.0020

  # K2 绝对下限：0.55→0.45（B35 修复：B34 的 0.55 会覆盖 anti_cancel 机制）
  # B34 问题：floor=0.55×1.07=0.589 > anti_cancel_alone=0.45×1.07=0.482
  # 导致 anti_cancel 被 floor 覆盖，path_01/02 对抗方向 K2 过高，收敛慢
  # B35 修复：floor=0.45×1.07=0.482，与 anti_cancel 结果一致，不再额外增加对抗力
  k2_min_floor_scale: 0.45

  # 积分项：path_04/05 积分长期饱和（78-89%），integral_max 从 0.010→0.015
  # 最大积分输出：Ki×integral_max = 0.42×0.015 = 0.0063 rad/s（原 0.38×0.010=0.0038）
  enable_integral: true
  Ki: 0.42
  integral_max: 0.015
  integral_decay: 0.992

  # LQR 输出滤波（单独一组，避免与 PID 的滤波状态相互干扰）
  # - 一般建议先只开 smoother，lowpass 视噪声情况再开
  output_filter:
    enabled: true
    use_smoother: true
    smoother_freq: 14.0
    smoother_damping: 0.9
    use_lowpass: false
    lowpass_alpha: 0.95

  # e_theta 一阶低通滤波（不平整地面专用）
  # 地板缝/接缝产生的瞬态航向扰动（~0.02-0.05 rad）经 K2 放大后引发次生横向误差
  # α=0.82：对 50ms 脉冲衰减 ~4x；对真实连续航向误差（<0.5 rad/s）影响 <5%
  e_theta_lowpass:
    enabled: true
    alpha: 0.82
