# =============================================================================
# RPP Follow Controller - 圆形路径配置文件
# =============================================================================
# 适用于：圆弧路径的特殊控制策略
# 特点：基于累计航向角变化的目标到达判定，基于基准角速度的偏差约束
# 结构：与代码中的 RPPParams 结构体对应
# =============================================================================

# -----------------------------------------------------------------------------
# 目标到达判定
# -----------------------------------------------------------------------------
goal:
  dist_tol: 0.02             # 位置容忍度 [m]
  rotate_tol: 0.035          # 角度容忍度 [rad]

# -----------------------------------------------------------------------------
# Pure Pursuit 前瞻控制
# -----------------------------------------------------------------------------
lookahead:
  time: 0.15                 # 前瞻时间 [s]
  min_dist: 0.18             # 最小前瞻距离 [m]
  max_dist: 0.18             # 最大前瞻距离 [m]

# -----------------------------------------------------------------------------
# 速度控制
# -----------------------------------------------------------------------------
velocity:
  linear:
    base: 0.06               # 基准线速度 [m/s]
    min: 0.08                # 最小线速度 [m/s]，圆形路径固定低速
    max: 0.3                 # 最大线速度 [m/s]
    max_inc: 0.06            # 最大加速度 [m/s²]
  angular:
    min: 0.03                # 最小角速度 [rad/s]
    max: 1.0                 # 最大角速度 [rad/s]
    max_inc: 0.06            # 最大角加速度 [rad/s²]

# -----------------------------------------------------------------------------
# 路径跟踪约束
# -----------------------------------------------------------------------------
tracking:
  regulated_min_radius: 0.5  # 曲率约束半径阈值 [m]
  approach:
    dist: 0.05               # 接近目标距离阈值 [m]
    min_v: 0.07              # 接近目标最小速度 [m/s]

# -----------------------------------------------------------------------------
# 角速度平滑
# -----------------------------------------------------------------------------
smoothing:
  type: 'lowpass'            # 'lowpass' | 'movingAverage' | 'none'
  radius_offset: 0.0         # 半径偏移量 [m]，用于补偿或调整
  lowpass:
    gain: 0.9                # 低通滤波增益 [0-1]
  moving_average:
    window_size: 1           # 移动平均窗口大小
  second_order:
    freq: 15.0               # 自然频率 [Hz]
    damping: 0.9             # 阻尼比 [-]

# -----------------------------------------------------------------------------
# 滤波器配置
# -----------------------------------------------------------------------------
filter:
  position:
    enabled: true
    active: false
    cutoff_freq: 1.5         # 截止频率 [Hz]
    sample_rate: 18.0        # 采样率 [Hz]
    output_limit: 0.3        # 输出限幅 [m]
    rate_limit: 0.3          # 变化率限制 [m/s]
  angular:
    enabled: true
    active: true
    use_offset_limit: true
    output_offset: 0.1       # 输出偏移量 [rad/s]
    cutoff_freq: 1.5         # 截止频率 [Hz]
    sample_rate: 18.0        # 采样率 [Hz]
    output_limit_rate: 1.05
    rate_limit: 0.03         # 变化率限制 [rad/s²]

# -----------------------------------------------------------------------------
# 运行模式
# -----------------------------------------------------------------------------
mode:
  low_speed: true            # 低速模式，圆形路径建议开启

# -----------------------------------------------------------------------------
# 调试与可视化
# -----------------------------------------------------------------------------
debug:
  enable_grid_map: true
  grid_map_path: 'grid_maps'

# -----------------------------------------------------------------------------
# 圆形路径偏差控制（核心参数）
# -----------------------------------------------------------------------------
# 圆形路径跟踪时的角速度约束策略：
# - 起始/结束阶段：允许较大偏差，便于切入和切出
# - 中间阶段：严格约束在基准角速度(v/r)附近
deviation:
  start_factor: 0.5          # 起始放宽区间 = factor × π [rad]
  end_factor: 0.5            # 结束放宽区间 = factor × π [rad]
  rate: 0.1                  # 放宽区间内的偏差比率
