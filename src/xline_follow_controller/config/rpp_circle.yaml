# =============================================================================
# RPP Follow Controller - 圆形路径配置文件
# =============================================================================
# 适用于：圆弧路径的特殊控制策略
# 特点：基于累计航向角变化的目标到达判定，基于基准角速度的偏差约束
# 结构：与代码中的 RPPParams 结构体对应
# =============================================================================

# -----------------------------------------------------------------------------
# 目标到达判定
# -----------------------------------------------------------------------------
goal:
  dist_tol: 0.02             # 位置容忍度 [m]
  rotate_tol: 0.035          # 角度容忍度 [rad]

# -----------------------------------------------------------------------------
# Pure Pursuit 前瞻控制
# -----------------------------------------------------------------------------
lookahead:
  time: 0.15                 # 前瞻时间 [s]
  min_dist: 0.18             # 最小前瞻距离 [m]
  max_dist: 0.18             # 最大前瞻距离 [m]

# -----------------------------------------------------------------------------
# 速度控制
# -----------------------------------------------------------------------------
velocity:
  linear:
    base: 0.06               # 基准线速度 [m/s]
    min: 0.05                # 最小线速度 [m/s]（曲线路径边界，圆形动态速度另有配置）
    max: 0.15                # 最大线速度 [m/s]（曲线路径边界，圆形动态速度另有配置）
    max_inc: 0.06            # 最大加速度 [m/s²]
  angular:
    min: 0.03                # 最小角速度 [rad/s]
    max: 1.0                 # 最大角速度 [rad/s]
    max_inc: 0.06            # 最大角加速度 [rad/s²]

# -----------------------------------------------------------------------------
# 路径跟踪约束
# -----------------------------------------------------------------------------
tracking:
  regulated_min_radius: 0.5  # 曲率约束半径阈值 [m]
  approach:
    dist: 0.05               # 接近目标距离阈值 [m]
    min_v: 0.07              # 接近目标最小速度 [m/s]

# -----------------------------------------------------------------------------
# 角速度平滑
# -----------------------------------------------------------------------------
smoothing:
  type: 'lowpass'            # 'lowpass' | 'movingAverage' | 'none'
  lowpass:
    gain: 0.9                # 低通滤波增益 [0-1]
  moving_average:
    window_size: 5           # 移动平均窗口大小
  second_order:
    freq: 15.0               # 自然频率 [Hz]
    damping: 0.9             # 阻尼比 [-]

# -----------------------------------------------------------------------------
# 滤波器配置
# -----------------------------------------------------------------------------
filter:
  position:
    enabled: true
    lowpass_active: false    # 是否实际应用四阶低通滤波
    cutoff_freq: 1.5         # 截止频率 [Hz]
    sample_rate: 18.0        # 采样率 [Hz]
    output_limit: 0.3        # 输出限幅 [m]
    rate_limit: 0.3          # 变化率限制 [m/s]
  angular:
    enabled: true
    lowpass_active: true     # 是否实际应用四阶低通滤波
    lowpass_use_offset_limit: true   # 是否启用四阶低通滤波偏移限制
    lowpass_output_offset: 0.1       # 四阶低通滤波输出偏移量 [rad/s]
    cutoff_freq: 1.5         # 截止频率 [Hz]
    sample_rate: 18.0        # 采样率 [Hz]
    output_limit_rate: 1.05
    rate_limit: 0.03         # 变化率限制 [rad/s²]


# -----------------------------------------------------------------------------
# 调试与可视化
# -----------------------------------------------------------------------------
debug:
  enable_grid_map: true
  grid_map_path: 'grid_maps'

# -----------------------------------------------------------------------------
# 圆形路径偏差控制（核心参数）
# -----------------------------------------------------------------------------
# 圆形路径跟踪时的角速度约束策略：
# - 起始/结束阶段：允许较大偏差，便于切入和切出
# - 中间阶段：严格约束在基准角速度(v/r)附近
deviation:
  start_factor: 0.1          # 起始放宽区间 = factor × π [rad]
  end_factor: 0.1            # 结束放宽区间 = factor × π [rad]
  strict_ratio: 0.05         # 中间阶段的严格偏差比例（相对基准角速度 v/r）
  relaxed_ratio: 0.05         # 起始/结束放宽区间的偏差比例

# =============================================================================
# 圆形路径动态参数配置（在 setPlanForCircle 时计算一次并保持恒定）
# =============================================================================
circle_dynamics:
  enabled: true                    # 是否启用动态计算（false 则使用 circle_fixed）

  # 速度计算配置: target_v = ref_v × (radius / ref_r)^γ
  velocity:
    reference_velocity: 0.08       # 参考速度 [m/s]
    reference_radius: 0.5          # 参考半径 [m]
    radius_exponent: 0.5           # 半径指数 γ
    min_velocity: 0.03             # 最小速度 [m/s]
    max_velocity: 0.1             # 最大速度 [m/s]

  # 前瞻距离计算配置: L = ref_L × (target_v / ref_v)^α × (radius / ref_r)^β
  lookahead:
    reference_lookahead: 0.18      # 参考前瞻距离 [m]
    velocity_exponent: 1.0         # 速度指数 α
    radius_exponent: 0.0           # 半径额外指数 β
    min_dist: 0.15                 # 最小前瞻距离 [m]
    max_dist: 0.2                 # 最大前瞻距离 [m]

# 备用固定值配置（当 circle_dynamics.enabled: false 时使用）
circle_fixed:
  velocity: 0.08                   # 固定线速度 [m/s]
  lookahead: 0.05                  # 固定前瞻距离 [m]
