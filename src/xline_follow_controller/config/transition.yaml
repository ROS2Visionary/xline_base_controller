# 动态伺服转场控制器配置文件

transition:
  # ============================================================================
  # 速度限制
  # ============================================================================
  max_velocity: 0.2              # 最大线速度 [m/s]
  max_angular_vel: 0.5           # 最大角速度 [rad/s]（提高旋转速度，避免绕圈）
  min_velocity: 0.03             # 最小线速度 [m/s]（正常行驶时避免过慢，近距离<10cm时不生效）

  # ============================================================================
  # 线速度加减速限制（让加速/减速更平滑）
  # ============================================================================
  linear_accel_limit: 0.25       # 最大加速度 [m/s^2]
  linear_decel_limit: 0.35       # 最大减速度 [m/s^2]（正数）

  # ============================================================================
  # 控制增益（核心参数）
  # ============================================================================
  k_linear: 1.0                  # 线速度比例增益
  k_angular: 2.0                 # 角速度比例增益

  # 调优指南：
  # - k_angular / k_linear 建议比例为 2:1 到 3:1
  # - k_angular 越大，转向越快，但可能震荡
  # - k_linear 越大，接近越快，但可能冲过头

  # ============================================================================
  # 到达判定
  # ============================================================================
  arrival_tolerance: 0.005        # 位置到达容差 [m]（0.5cm，高精度要求）
  arrival_angle_tolerance: 0.01   # 角度到达容差 [rad]（5.7° = 0.1 rad）
  arrival_confirm_count: 3       # 连续确认次数（防抖动）

  # 精度说明：
  # 位置精度：
  # - 0.01m (1cm):  高精度，需要好的传感器
  # - 0.03m (3cm):  标准精度（推荐）
  # - 0.05m (5cm):  中等精度
  # - 0.10m (10cm): 低精度
  #
  # 角度精度：
  # - 0.05 rad (2.9°):  高精度
  # - 0.10 rad (5.7°):  标准精度（推荐）
  # - 0.15 rad (8.6°):  中等精度
  # - 0.20 rad (11.5°): 低精度

  # ============================================================================
  # 减速控制
  # ============================================================================
  slow_down_distance: 0.4         # 减速区距离 [m]（增大让速度更平滑）
  creep_velocity: 0.01           # 蠕动速度 [m/s]

  # 说明：
  # - 距离 > slow_down_distance: 正常速度
  # - 距离 < slow_down_distance: 渐进减速
  # - 距离 < 0.1m: 固定蠕动速度
  # - 0.4m 可以让机器人有更平滑的减速过程

  # ============================================================================
  # 大转角处理（关键改进）
  # ============================================================================
  large_angle_threshold: 1.047   # 大转角阈值 [rad]（60° = 1.047 rad）
  large_angle_vel_ratio: 0.4     # 大转角时速度比例

  # 说明：
  # - 当航向误差 > large_angle_threshold 时，线速度降低为 ratio 倍
  # - ratio 越小，大转角时路径越紧凑，但时间可能更长
  # - 推荐范围：0.3 - 0.5

  # ============================================================================
  # 姿态伺服（控制目标朝向时启用）
  # ============================================================================
  pose_servo_distance: 0.6       # 姿态伺服切换距离 [m]（增大避免频繁切换）

  # 说明：
  # - 距离 > pose_servo_distance: 优先接近，航向指向目标点
  # - 距离 < pose_servo_distance: 同时收敛位置和朝向
  # - 越大：到点越快，朝向调整更平滑，避免目标航向跳变
  # - 越小：朝向收敛越早，但可能路径更长，切换时可能抖动
  # - 推荐范围：0.5 - 0.8m（0.3m可能导致频繁切换）

  # ============================================================================
  # 阶段1重入控制（从阶段2退回阶段1时的速度限制）
  # ============================================================================
  allow_stage2_exit: true                 # 是否允许从阶段2退回阶段1（位置漂移过大时）
  stage1_reentry_max_velocity: 0.01      # 重入时最大线速度 [m/s]（比正常速度小，避免震荡）
  stage1_reentry_max_angular_vel: 0.05    # 重入时最大角速度 [rad/s]（使用最小角速度，减少漂移）

  # 说明：
  # allow_stage2_exit 模式选择：
  # - true（高精度模式）：位置漂移 > 阈值时退回阶段1重新收敛，保证 0.5cm 精度
  #   适用场景：精密对接、充电桩、货架对接等需要高位置精度的场景
  # - false（快速模式）：进入阶段2后不再退出，只专注朝向对准，允许位置漂移
  #   适用场景：巡航导航、一般转场等对位置精度要求不高的场景（可能有2-5cm漂移）
  #
  # 重入速度限制（仅在 allow_stage2_exit=true 时生效）：
  # - 当从阶段2退回阶段1时，使用更小的速度避免震荡
  # - stage1_reentry_max_velocity 建议为 max_velocity 的 1/2 到 1/4
  # - stage1_reentry_max_angular_vel 建议使用 rotation.absolute_min_w 或稍大

  # ============================================================================
  # 阶段2航向对准（原地旋转对准终点朝向）
  # 与 src/xline_follow_controller/src/line_follow/line_follow_controller.cpp 的对齐方式一致
  # ============================================================================
  rotation:
    enabled: true                # true: 使用 sigmoid+平滑 的 rotation 方式；false: 使用 k_angular 比例控制
    max_w: 0.5                   # 最大角速度 [rad/s]（通常可与 max_angular_vel 保持一致）
    min_w: 0.1                  # 最小角速度 [rad/s]（克服静摩擦，过大可能导致过冲）
    absolute_min_w: 0.08         # 绝对最小角速度 [rad/s]（不会被动态缩减，保证机器人始终能动）
                                 # 说明：当角度误差很小时，min_w 会被动态缩减以避免过冲抖动
                                 #      但缩减后不会低于 absolute_min_w，确保机器人不会因速度太低而卡住
                                 #      建议值：0.02-0.05 rad/s（根据机器人静摩擦调整）
    factor: 1.2                  # sigmoid 因子（越大越"硬"，误差稍大就接近 max_w）
    angle_threshold: 0.6         # 近零平滑阈值 [rad]
    smooth_factor: 0.6           # 近零平滑系数（越大越快衰减）
    stop_tolerance: 0.01         # 认为"已对准"的角度阈值 [rad]（会被限制到 <= arrival_angle_tolerance）
    use_crossing_stop: true      # 允许"过零即认为对准"（减少来回抖动）
    crossing_window: 0.35        # 过零判定窗口 [rad]（仅在误差均 < 该值时允许过零判定）

  # ============================================================================
  # 后退模式（智能减少转弯）
  # ============================================================================
  enable_backward: true          # 是否启用后退模式
  backward_angle_threshold: 2.618 # 后退角度阈值 [rad]（150° = 2.618 rad，避免绕圈）

  # 说明：
  # - 当目标在机器人后方且朝向接近时，使用后退代替转弯+前进
  # - 判断条件：
  #   1. 目标点在机器人后方（局部坐标系 x < 0）
  #   2. 目标朝向与当前朝向误差 < backward_angle_threshold
  # - 优势：
  #   例：当前(0,0,0°) → 目标(-1,0,55°)
  #   前进模式：转125° + 前进0.25m ≈ 6s（原地打转）
  #   后退模式：后退0.25m + 调整55° ≈ 3s（节省50%时间）
  # - 推荐阈值：
  #   150° (2.618): 非常宽松（避免绕圈，推荐）
  #   90° (1.571): 宽松（覆盖大部分场景）
  #   60° (1.047): 标准
  #   30° (0.524): 严格（可能导致不必要的转向）

  # ============================================================================
  # 平滑控制
  # ============================================================================
  velocity_smooth_alpha: 0.7     # 速度平滑系数（一阶低通滤波）

  # 说明：
  # - alpha 越大，响应越快，但可能抖动
  # - alpha 越小，越平滑，但响应慢
  # - 推荐范围：0.6 - 0.8

  # ============================================================================
  # 调试
  # ============================================================================
  debug_enabled: true           # 是否启用调试输出
