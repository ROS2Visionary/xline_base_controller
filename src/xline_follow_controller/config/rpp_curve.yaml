# =============================================================================
# RPP Follow Controller - 曲线路径配置文件
# =============================================================================
# 适用于：一般曲线路径的 Pure Pursuit 跟随控制
# 结构：与代码中的 RPPParams 结构体对应
# =============================================================================

# -----------------------------------------------------------------------------
# 目标到达判定
# -----------------------------------------------------------------------------
goal:
  dist_tol: 0.02             # 位置容忍度 [m]
  rotate_tol: 0.035          # 角度容忍度 [rad]，约2°

# -----------------------------------------------------------------------------
# Pure Pursuit 前瞻控制
# -----------------------------------------------------------------------------
lookahead:
  time: 0.15                 # 前瞻时间 [s]
  min_dist: 0.18             # 最小前瞻距离 [m]
  max_dist: 0.18             # 最大前瞻距离 [m]

# -----------------------------------------------------------------------------
# 速度控制
# -----------------------------------------------------------------------------
velocity:
  linear:
    base: 0.06               # 基准线速度 [m/s]
    min: 0.06                # 最小线速度 [m/s]
    max: 0.3                 # 最大线速度 [m/s]
    max_acceleration: 0.06            # 最大加速度 [m/s²]
  angular:
    min: 0.03                # 最小角速度 [rad/s]
    max: 1.0                 # 最大角速度 [rad/s]
    max_acceleration: 0.06            # 最大角加速度 [rad/s²]

# -----------------------------------------------------------------------------
# 路径跟踪约束
# -----------------------------------------------------------------------------
tracking:
  regulated_min_radius: 0.5  # 曲率约束半径阈值 [m]
  approach:
    dist: 0.05               # 接近目标距离阈值 [m]
    min_v: 0.07              # 接近目标最小速度 [m/s]

# -----------------------------------------------------------------------------
# 角速度平滑
# -----------------------------------------------------------------------------
smoothing:
  type: 'lowpass'            # 'lowpass' | 'movingAverage' | 'none'
  lowpass:
    gain: 0.9                # 低通滤波增益 [0-1]
  moving_average:
    window_size: 5           # 移动平均窗口大小
  second_order:
    freq: 15.0               # 自然频率 [Hz]
    damping: 0.9             # 阻尼比 [-]

# -----------------------------------------------------------------------------
# 滤波器配置
# -----------------------------------------------------------------------------
filter:
  position:
    lowpass_use_biquad_cascade: true # 是否使用双二阶级联
    lowpass_active: false    # 是否实际应用四阶低通滤波
    cutoff_freq: 1.5         # 截止频率 [Hz]
    sample_rate: 18.0        # 采样率 [Hz]
    output_limit: 0.3        # 输出限幅 [m]
    rate_limit: 0.3          # 变化率限制 [m/s]
  angular:
    lowpass_use_biquad_cascade: true # 是否使用双二阶级联
    lowpass_active: true     # 是否实际应用四阶低通滤波
    lowpass_use_offset_limit: true   # 是否启用四阶低通滤波偏移限制
    lowpass_output_offset: 0.1       # 四阶低通滤波输出偏移量 [rad/s]
    cutoff_freq: 1.5         # 截止频率 [Hz]
    sample_rate: 18.0        # 采样率 [Hz]
    output_limit_rate: 1.05  # 输出限幅比率 [-]
    rate_limit: 0.03         # 变化率限制 [rad/s²]

# -----------------------------------------------------------------------------
# 调试与可视化
# -----------------------------------------------------------------------------
debug:
  enable_grid_map: true      # 是否启用栅格图
  grid_map_path: 'grid_maps' # 栅格图保存路径

# -----------------------------------------------------------------------------
# 偏差控制（起始/结束阶段的角速度约束）
# -----------------------------------------------------------------------------
deviation:
  start_factor: 0.5          # 起始阶段偏差因子
  end_factor: 0.5            # 结束阶段偏差因子
  strict_ratio: 0.05         # 中间阶段的严格偏差比例（相对基准角速度 v/r）
  relaxed_ratio: 0.1         # 起始/结束放宽区间的偏差比例
